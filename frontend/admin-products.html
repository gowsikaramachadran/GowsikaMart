<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Products — GowsikaMart Admin</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">Gowsika<span style="color:#ff6f1e;">Mart</span> Admin</div>
    <a href="admin-dashboard.html">📊 Dashboard</a>
    <a href="admin-products.html" class="active">📦 Products</a>
    <a href="admin-orders.html">🧾 Orders</a>
    <a href="admin-users.html">👥 Users</a>
    <a href="index.html">🏬 View Storefront</a>
    <a href="#" id="admin-logout">🚪 Logout</a>
  </aside>

  <main class="admin-main">
    <div class="admin-toolbar">
      <h2 style="margin:0;">Manage Products</h2>
      <button class="btn btn-primary" id="add-product-btn">+ Add Product</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
        <tbody id="products-body"><tr><td colspan="6">Loading...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Add/Edit Product Modal -->
<div class="modal-backdrop" id="product-modal">
  <div class="modal-box">
    <h3 id="modal-title">Add Product</h3>
    <div id="modal-alert"></div>
    <form id="product-form">
      <input type="hidden" id="p-id" />
      <div class="form-group"><label>Product Name</label><input type="text" id="p-name" required/></div>
      <div class="form-group"><label>Brand</label><input type="text" id="p-brand"/></div>
      <div class="form-group"><label>Category</label><select id="p-category" required></select></div>
      <div class="form-row">
        <div class="form-group"><label>Price (₹)</label><input type="number" id="p-price" required min="0" step="0.01"/></div>
        <div class="form-group"><label>Discount (%)</label><input type="number" id="p-discount" min="0" max="90" value="0"/></div>
      </div>
      <div class="form-group"><label>Stock Quantity</label><input type="number" id="p-stock" required min="0"/></div>
      <div class="form-group"><label>Image URL (optional — leave blank for placeholder)</label><input type="text" id="p-image"/></div>
      <div class="form-group"><label>Description</label><textarea id="p-desc" rows="3"></textarea></div>
      <div style="display:flex; gap:20px; margin-bottom:16px; flex-wrap:wrap;">
        <label class="filter-option"><input type="checkbox" id="p-bestseller"/> Best Seller</label>
        <label class="filter-option"><input type="checkbox" id="p-newarrival"/> New Arrival</label>
        <label class="filter-option"><input type="checkbox" id="p-trending"/> Trending</label>
        <label class="filter-option"><input type="checkbox" id="p-deal"/> Today's Deal</label>
      </div>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn btn-primary" style="flex:1;">Save Product</button>
        <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
let categoriesCache = [];
let editingId = null;

async function loadProducts() {
  const body = document.getElementById("products-body");
  try {
    const products = await Api.adminGetProducts();
    if (products.length === 0) {
      body.innerHTML = `<tr><td colspan="6">No products found.</td></tr>`;
      return;
    }
    body.innerHTML = products.map(p => `
      <tr>
        <td>${p.id}</td>
        <td>${p.name}</td>
        <td>${p.category ? p.category.name : "-"}</td>
        <td>${formatCurrency(p.finalPrice)}</td>
        <td>${p.stockQuantity}</td>
        <td>
          <button class="btn btn-sm btn-outline" onclick="editProduct(${p.id})">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
        </td>
      </tr>
    `).join("");
  } catch (err) {
    body.innerHTML = `<tr><td colspan="6">${err.message}</td></tr>`;
  }
}

async function loadCategoriesIntoSelect() {
  categoriesCache = await Api.getCategories();
  document.getElementById("p-category").innerHTML = categoriesCache.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
}

function openModal(title) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-alert").innerHTML = "";
  document.getElementById("product-modal").classList.add("open");
}
function closeModal() {
  document.getElementById("product-modal").classList.remove("open");
  document.getElementById("product-form").reset();
  editingId = null;
}

document.getElementById("add-product-btn").addEventListener("click", () => {
  editingId = null;
  openModal("Add Product");
});
document.getElementById("modal-cancel").addEventListener("click", closeModal);

async function editProduct(id) {
  try {
    const p = await Api.getProduct(id);
    editingId = id;
    document.getElementById("p-name").value = p.name;
    document.getElementById("p-brand").value = p.brand || "";
    document.getElementById("p-category").value = p.category.id;
    document.getElementById("p-price").value = p.price;
    document.getElementById("p-discount").value = p.discountPercent;
    document.getElementById("p-stock").value = p.stockQuantity;
    document.getElementById("p-image").value = p.imageUrl || "";
    document.getElementById("p-desc").value = p.description || "";
    document.getElementById("p-bestseller").checked = p.bestSeller;
    document.getElementById("p-newarrival").checked = p.newArrival;
    document.getElementById("p-trending").checked = p.trending;
    document.getElementById("p-deal").checked = p.todayDeal;
    openModal("Edit Product");
  } catch (err) { alert(err.message); }
}

async function deleteProduct(id) {
  if (!confirm("Are you sure you want to delete this product?")) return;
  try {
    await Api.adminDeleteProduct(id);
    loadProducts();
  } catch (err) { alert(err.message); }
}

document.getElementById("product-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const category = categoriesCache.find(c => String(c.id) === document.getElementById("p-category").value);

  const payload = {
    name: document.getElementById("p-name").value.trim(),
    brand: document.getElementById("p-brand").value.trim(),
    category: category,
    price: parseFloat(document.getElementById("p-price").value),
    discountPercent: parseFloat(document.getElementById("p-discount").value || "0"),
    stockQuantity: parseInt(document.getElementById("p-stock").value),
    imageUrl: document.getElementById("p-image").value.trim(),
    description: document.getElementById("p-desc").value.trim(),
    bestSeller: document.getElementById("p-bestseller").checked,
    newArrival: document.getElementById("p-newarrival").checked,
    trending: document.getElementById("p-trending").checked,
    todayDeal: document.getElementById("p-deal").checked,
    rating: 4.0,
    ratingCount: 0
  };

  try {
    if (editingId) {
      await Api.adminUpdateProduct(editingId, payload);
    } else {
      await Api.adminAddProduct(payload);
    }
    closeModal();
    loadProducts();
  } catch (err) {
    document.getElementById("modal-alert").innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
});

if (requireAdmin()) {
  loadCategoriesIntoSelect();
  loadProducts();
}

document.getElementById("admin-logout").addEventListener("click", (e) => {
  e.preventDefault();
  clearSession();
  window.location.href = "index.html";
});
</script>
</body>
</html>
