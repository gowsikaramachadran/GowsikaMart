<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order History — GowsikaMart</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="bm-header"></div>

<div class="container">
  <div class="breadcrumb"><a href="index.html">Home</a> / <a href="account.html">My Account</a> / <span>Orders</span></div>

  <div class="account-layout">
    <nav class="account-nav">
      <a href="account.html">Profile Details</a>
      <a href="account-orders.html" class="active">Order History</a>
      <a href="#" id="logout-side">Logout</a>
    </nav>

    <div class="account-panel">
      <h3 style="margin-top:0;">Order History</h3>
      <div id="orders-list"><p>Loading orders...</p></div>
    </div>
  </div>
</div>

<div id="bm-footer"></div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
if (requireLogin()) {
  Api.getMyOrders().then(orders => {
    const el = document.getElementById("orders-list");
    if (orders.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">📦</div><p>You haven't placed any orders yet.</p><a href="shop.html" class="btn btn-primary" style="margin-top:10px; display:inline-block;">Start Shopping</a></div>`;
      return;
    }
    el.innerHTML = orders.map(o => `
      <div class="order-card">
        <div class="row-top">
          <span>Order #${o.id} · ${new Date(o.createdAt).toLocaleDateString("en-IN", { year: "numeric", month: "short", day: "numeric" })}</span>
          <span class="status-pill status-${o.status}">${o.status}</span>
        </div>
        ${o.items.map(i => `<div class="order-line"><span>${i.productName} × ${i.quantity}</span><span>${formatCurrency(i.price * i.quantity)}</span></div>`).join("")}
        <div class="summary-row total" style="margin-top:10px;"><span>Total</span><span>${formatCurrency(o.totalAmount)}</span></div>
      </div>
    `).join("");
  }).catch(err => {
    document.getElementById("orders-list").innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  });
}

document.getElementById("logout-side").addEventListener("click", (e) => {
  e.preventDefault();
  clearSession();
  window.location.href = "index.html";
});
</script>
</body>
</html>
