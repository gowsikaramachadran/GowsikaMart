<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — GowsikaMart</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="bm-header"></div>

<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 460px;">
    <h2>Create Your Account</h2>
    <div class="sub">Join GowsikaMart and start shopping today</div>

    <div id="form-alert"></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required placeholder="e.g. Priya Sharma" />
        <div class="form-error" id="err-fullName"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
        <div class="form-error" id="err-email"></div>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" required maxlength="10" placeholder="10-digit mobile number" />
        <div class="form-error" id="err-phone"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <div class="pw-wrapper">
            <input type="password" id="password" required placeholder="Min 6 characters" />
            <button type="button" class="toggle-pw" data-target="password">SHOW</button>
          </div>
          <div class="form-error" id="err-password"></div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="pw-wrapper">
            <input type="password" id="confirmPassword" required placeholder="Re-enter password" />
            <button type="button" class="toggle-pw" data-target="confirmPassword">SHOW</button>
          </div>
          <div class="form-error" id="err-confirmPassword"></div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="register-btn">Create Account</button>
    </form>

    <div class="form-footer-link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>
</div>

<div id="bm-footer"></div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
document.querySelectorAll(".toggle-pw").forEach(btn => {
  btn.addEventListener("click", () => {
    const input = document.getElementById(btn.dataset.target);
    if (input.type === "password") { input.type = "text"; btn.textContent = "HIDE"; }
    else { input.type = "password"; btn.textContent = "SHOW"; }
  });
});

function clearErrors() {
  document.querySelectorAll(".form-error").forEach(el => el.textContent = "");
  document.getElementById("form-alert").innerHTML = "";
}

function validateClientSide() {
  let valid = true;
  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (fullName.length < 2) {
    document.getElementById("err-fullName").textContent = "Please enter your full name";
    valid = false;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    document.getElementById("err-email").textContent = "Enter a valid email address";
    valid = false;
  }
  if (!/^[6-9]\d{9}$/.test(phone)) {
    document.getElementById("err-phone").textContent = "Enter a valid 10-digit mobile number";
    valid = false;
  }
  if (password.length < 6) {
    document.getElementById("err-password").textContent = "Password must be at least 6 characters";
    valid = false;
  }
  if (password !== confirmPassword) {
    document.getElementById("err-confirmPassword").textContent = "Passwords do not match";
    valid = false;
  }
  return valid;
}

document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearErrors();
  if (!validateClientSide()) return;

  const btn = document.getElementById("register-btn");
  btn.disabled = true;
  btn.textContent = "Creating account...";

  const payload = {
    fullName: document.getElementById("fullName").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    password: document.getElementById("password").value,
    confirmPassword: document.getElementById("confirmPassword").value
  };

  try {
    const res = await Api.register(payload);
    saveSession(res);
    window.location.href = "index.html";
  } catch (err) {
    document.getElementById("form-alert").innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    btn.disabled = false;
    btn.textContent = "Create Account";
  }
});
</script>
</body>
</html>
