# ==========================================
# GowsikaMart - Application Configuration
# ==========================================

server.port=8080

# ---------- MySQL Database ----------
spring.datasource.url=jdbc:mysql://localhost:3306/gowsikamart_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Run data.sql after Hibernate creates tables (first run only recommended)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ---------- JWT ----------
gowsikamart.jwt.secret=GowsikaMartSuperSecretKeyForJWTSigning2026ChangeThisInProduction
gowsikamart.jwt.expiration-ms=86400000

# ---------- CORS ----------
gowsikamart.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,null

# ---------- File upload (product images) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
gowsikamart.upload.dir=uploads/products
